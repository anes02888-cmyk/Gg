name: Deploy Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Extract Zip
      run: |
        unzip -q -o "-llamacoder.zip" -d ./app

    - name: Build Web App
      run: |
        cd app
        # البحث عن مجلد المشروع الداخلي إن وجد
        if [ -d "project" ]; then cd project; fi
        if [ -f "package.json" ]; then
          npm install
          npm run build --if-present
        fi

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: './app/dist'

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2
