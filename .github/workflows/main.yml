name: Build Executable App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Extract Zip File
      run: |
        Expand-Archive -Path "-llamacoder.zip" -DestinationPath "./app" -Force

    - name: Setup Electron Wrapper & Build
      run: |
        cd app
        # البحث عن المجلد الفعلي المزدوج إن وجد
        $innerFolder = Get-ChildItem -Directory | Select-Object -First 1
        if ($innerFolder -and (Test-Path "$($innerFolder.FullName)\package.json")) {
            Set-Location $innerFolder.FullName
        }
        
        # تثبيت المكتبات وتجهيز Electron
        npm install
        npm install --save-dev electron electron-builder
        
        # إنشاء ملف التشغيل الرئيسي لـ Electron
        @'
        const { app, BrowserWindow } = require('electron');
        const path = require('path');

        function createWindow () {
          const win = new BrowserWindow({
            width: 1200,
            height: 800,
            webPreferences: {
              nodeIntegration: true
            }
          });
          
          if (require('fs').existsSync(path.join(__dirname, 'dist/index.html'))) {
            win.loadFile(path.join(__dirname, 'dist/index.html'));
          } else if (require('fs').existsSync(path.join(__dirname, 'build/index.html'))) {
            win.loadFile(path.join(__dirname, 'build/index.html'));
          } else {
            win.loadFile(path.join(__dirname, 'index.html'));
          }
        }

        app.whenReady().then(createWindow);
        '@ | Out-File -FilePath "electron-main.js" -Encoding utf8

        # بناء ملف الويب أولاً ثم ملف .exe
        npm run build --if-present
        npx electron-builder --config.extraMetadata.main=electron-main.js --win portable

    - name: Upload App For Download
      uses: actions/upload-artifact@v3
      with:
        name: VoiceForge-Executable-App
        path: app/**/dist/*.exe
