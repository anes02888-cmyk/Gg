name: Build Executable App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Extract Zip File
      run: |
        Expand-Archive -Path "-llamacoder.zip" -DestinationPath "./app" -Force

    - name: Install & Build Web App
      run: |
        cd app
        if (Test-Path "package.json") {
          npm install
          npm run build --if-present
        }

    - name: Package Desktop App with Nativefier
      run: |
        npm install -g nativefier
        cd app
        if (Test-Path "dist") {
          nativefier --name "VoiceForgeApp" "./dist" --single-instance
        } else {
          nativefier --name "VoiceForgeApp" "." --single-instance
        }

    - name: Upload App For Download
      uses: actions/upload-artifact@v3
      with:
        name: VoiceForge-Executable-App
        path: app/*win32-x64*
