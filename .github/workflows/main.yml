name: Build Executable App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Extract Project Zip
      run: |
        Expand-Archive -Path "-llamacoder.zip" -DestinationPath "./extracted" -Force

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE
      run: |
        Get-ChildItem -Path ./extracted -Recurse -Filter "*.py" | Select-Object -First 1 | ForEach-Object { pyinstaller --onefile $_.FullName }

    - name: Upload App For Download
      uses: actions/upload-artifact@v3
      with:
        name: My-Ready-App
        path: dist/*.exe
